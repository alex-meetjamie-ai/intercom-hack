<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171e1c" />
    <meta name="description" content="A sunny journey through our Berlin office." />
    <title>Office Hours — Linienstraße 144 · Berlin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="app">
      <section id="viewport" aria-label="Interactive office journey">
        <canvas id="office-canvas" role="img" aria-label="Sunny cartoon office in Berlin. Drag to look around after each interaction."></canvas>
        <div id="loading" class="loading" role="status"><span></span></div>
        <div id="render-error" class="render-error" hidden role="alert">The 3D view could not start. Enable WebGL and reload.</div>
      </section>
      <div class="location-mark" aria-hidden="true"><span class="live-dot"></span>144 <span class="location-city">BERLIN</span></div>
      <div class="voice-controls"><button id="voice" type="button">Speak to Jamie</button><button id="play-audio" type="button" hidden>Enable audio</button></div>
      <audio id="remote-audio" autoplay playsinline></audio>
      <p id="live-transcript" class="live-transcript" role="log" aria-live="polite" hidden></p>
      <button id="restart" class="restart icon-button" type="button" aria-label="Restart journey" title="Restart journey">↺</button>
      <section id="notification-panel" class="phone-accessibility" aria-label="Phone decision: select Yes or No on the phone screen" hidden>
        <div class="notification-heading"><span class="live-dot"></span>Doorbell <span class="notification-time">now</span></div>
        <p id="decision-message" aria-live="polite">Pizza delivery</p>
        <div class="decision-buttons"><button id="deny" type="button">No, keep door closed</button><button id="allow" type="button">Yes, let them in <span aria-hidden="true">↗</span></button></div>
      </section>
      <nav class="journey-controls" aria-label="Journey controls">
        <button id="back" class="icon-button" type="button" aria-label="Previous moment" disabled>←</button>
        <span class="moment-count"><span id="step-number">01</span><span class="count-divider">/</span>06</span>
        <button id="next" type="button"><span id="next-label">Next</span><span aria-hidden="true">→</span></button>
        <div class="progress-track" aria-hidden="true"><div id="scene-progress"></div></div>
      </nav>
      <p id="step-title" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <p id="api-feedback" class="toast" role="status" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
