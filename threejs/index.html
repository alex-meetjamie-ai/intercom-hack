<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171e1c" />
    <meta name="description" content="A sunny journey through our Berlin office." />
    <title>Office Hours — Linienstraße 144 · Berlin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="app">
      <section id="viewport" aria-label="Interactive office journey">
        <canvas id="office-canvas" role="img" aria-label="Sunny cartoon office in Berlin. Drag to look around after each interaction."></canvas>
        <div id="loading" class="loading" role="status"><span></span></div>
        <div id="render-error" class="render-error" hidden role="alert">The 3D view could not start. Enable WebGL and reload.</div>
      </section>
      <audio id="remote-audio" autoplay playsinline></audio>
      <button id="play-audio" class="audio-fallback" type="button" hidden>Enable audio</button>
      <p id="live-transcript" class="sr-only" role="log" aria-live="polite" hidden></p>
      <div class="accessible-controls">
        <button id="call-jamie" type="button">Call Jamie on the intercom</button>
        <button id="call-lift" type="button" hidden>Call elevator</button>
        <button id="allow" type="button" hidden>Yes, let them in</button>
        <button id="deny" type="button" hidden>No, end call</button>
        <button id="restart" type="button">Restart presentation</button>
      </div>
      <p id="step-title" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <p id="api-feedback" class="toast" role="status" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
